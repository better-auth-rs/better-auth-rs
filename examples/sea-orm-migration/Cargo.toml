[package]
name = "sea-orm-migration-example"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("sqlx-postgres", "sqlx-sqlite"))',
] }

[features]
default = ["sqlx-sqlite"]
sqlx-sqlite = []
sqlx-postgres = []

[dependencies]
better-auth = { path = "../..", features = ["axum", "sqlx-sqlite", "derive"] }
better-auth-core = { path = "../../crates/core", features = [
    "derive",
    "sqlx-sqlite",
] }
sea-orm = { version = "2.0.1", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "macros",
    "chrono",
    "with-chrono",
    "with-json",
    "with-uuid",
    "schema-sync",
    "entity-registry",
] }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
