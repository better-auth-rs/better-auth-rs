name: Upstream fixture capture

on:
  push:
    branches: [codex/upstream-capture]
    paths:
      - .github/workflows/upstream-capture.yml
      - compat-tests/reference-server/package.json
      - compat-tests/reference-server/bun.lock
      - compat-tests/reference-server/contracts/plugin-output-capabilities-capture.mjs

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Capture pinned upstream contract
        shell: devenv shell -- bash -e {0}
        run: |
          set -euo pipefail
          capture_dir="$RUNNER_TEMP/upstream-fixtures"
          mkdir -p "$capture_dir"
          printf '%s\n' "$GITHUB_SHA" > "$capture_dir/source-sha.txt"
          bun install --cwd compat-tests/reference-server --frozen-lockfile
          bun --no-install ./compat-tests/reference-server/contracts/plugin-output-capabilities-capture.mjs "$capture_dir/plugin-output-capabilities-1.7.6.json" 2>&1 | tee "$capture_dir/plugin-output-capabilities.log"
          (
            cd "$capture_dir"
            sha256sum *.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-plugin-output-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-fixtures/
          if-no-files-found: error
          retention-days: 14
