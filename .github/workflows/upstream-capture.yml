name: Upstream fixture capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture upstream fixtures or prepare driver dependency locks
        type: choice
        default: fixture
        required: true
        options:
          - fixture
          - dependencies

permissions:
  contents: read

jobs:
  capture:
    if: ${{ inputs.mode != 'dependencies' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: native-radix-parsing
            regressions: []
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'postgres:18.6' || '' }}
        env:
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth_ci
          POSTGRES_DB: better_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U better_auth -d better_auth_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.backend == 'mysql' && 'mysql:8.4.11' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: better_auth_ci
          MYSQL_ROOT_HOST: "%"
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbetter_auth_ci --silent"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Capture pinned upstream contract
        shell: devenv shell -- bash -e {0}
        env:
          TZ: UTC
          CAPTURE_CONTRACT: ${{ matrix.contract }}
          CAPTURE_SCRIPT: ${{ matrix.script || format('compat-tests/reference-server/contracts/{0}-capture.mjs', matrix.contract) }}
          CAPTURE_REGRESSIONS: ${{ join(matrix.regressions, ' ') }}
          CAPTURE_BACKEND: ${{ matrix.backend }}
          BETTER_AUTH_TEST_POSTGRES_URL: postgres://better_auth:better_auth_ci@127.0.0.1:5432/better_auth_test
          BETTER_AUTH_TEST_MYSQL_URL: mysql://root:better_auth_ci@127.0.0.1:3306/mysql
        run: |
          set -euo pipefail
          capture_dir="$RUNNER_TEMP/upstream-fixtures"
          mkdir -p "$capture_dir"
          printf '%s\n' "$GITHUB_SHA" > "$capture_dir/source-sha.txt"
          bun install --cwd compat-tests/reference-server --frozen-lockfile
          read -r -a capture_regressions <<< "$CAPTURE_REGRESSIONS"
          regression_args=()
          for regression in "${capture_regressions[@]}"; do
            regression_args+=("./compat-tests/reference-server/contracts/$regression.test.ts")
          done
          if (( ${#regression_args[@]} )); then
            bun --no-install test "${regression_args[@]}" 2>&1 | tee "$capture_dir/regression.log"
          fi
          capture_args=()
          capture_suffix=""
          if [[ -n "$CAPTURE_BACKEND" ]]; then
            capture_args+=("$CAPTURE_BACKEND")
            capture_suffix="-$CAPTURE_BACKEND"
          fi
          if [[ "$CAPTURE_CONTRACT" == telemetry-fields-unique ]]; then
            export NODE_ENV=production TEST=''
            export BETTER_AUTH_TELEMETRY_ENDPOINT=https://telemetry-fields-unique.test/capture
          fi
          bun --no-install "$CAPTURE_SCRIPT" "${capture_args[@]}" "$capture_dir/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json" 2>&1 | tee "$capture_dir/capture.log"
          python3 -m json.tool "$capture_dir/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json" > /dev/null
          mkdir -p "$capture_dir/replay"
          bun --no-install "$CAPTURE_SCRIPT" "${capture_args[@]}" "$capture_dir/replay/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json" 2>&1 | tee "$capture_dir/replay.log"
          python3 -m json.tool "$capture_dir/replay/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json" > /dev/null
          cmp "$capture_dir/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json" "$capture_dir/replay/$CAPTURE_CONTRACT$capture_suffix-1.7.6.json"
          (
            cd "$capture_dir"
            sha256sum *.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ matrix.contract }}${{ matrix.backend != '' && format('-{0}', matrix.backend) || '' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-fixtures/
          if-no-files-found: error
          retention-days: 14

  dependency-locks:
    if: ${{ inputs.mode == 'dependencies' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth_ci
          POSTGRES_DB: better_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U better_auth -d better_auth_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: better_auth_ci
          MYSQL_ROOT_HOST: "%"
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbetter_auth_ci --silent"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://better_auth:better_auth_ci@127.0.0.1:5432/better_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Prepare pinned driver dependency locks
        id: dependencies
        shell: devenv shell -- bash -e {0}
        run: ./scripts/prepare-driver-error-dependencies.sh "$RUNNER_TEMP/driver-error-dependencies"
      - name: Test PostgreSQL driver protocol and original response metadata
        if: always() && steps.dependencies.outcome == 'success'
        shell: devenv shell -- bash -e {0}
        run: ./scripts/test-postgres-driver-protocol.sh "$RUNNER_TEMP/driver-error-dependencies"
      - name: Test MySQL driver command ownership and original errors
        if: always() && steps.dependencies.outcome == 'success'
        shell: devenv shell -- bash -e {0}
        env:
          DATABASE_URL: mysql://root:better_auth_ci@127.0.0.1:3306/mysql
        run: ./scripts/test-mysql-driver-errors.sh "$RUNNER_TEMP/driver-error-dependencies/mysql-driver"
      - name: Check the complete pinned mysql2 error table
        if: always() && steps.dependencies.outcome == 'success'
        shell: devenv shell -- bash -e {0}
        run: |
          bun install --cwd compat-tests/reference-server --frozen-lockfile
          python3 scripts/check-mysql-error-codes.py
      - name: Preserve dependency manifests and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-error-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/driver-error-dependencies/source-sha.txt
            ${{ runner.temp }}/driver-error-dependencies/features-before.json
            ${{ runner.temp }}/driver-error-dependencies/*.log
            ${{ runner.temp }}/driver-error-dependencies/test-root.txt
            ${{ runner.temp }}/driver-error-dependencies/validation.json
            ${{ runner.temp }}/driver-error-dependencies/graphs/*.json
            ${{ runner.temp }}/driver-error-dependencies/mysql-driver/
            ${{ runner.temp }}/driver-error-dependencies/manifest.txt
            ${{ runner.temp }}/driver-error-dependencies/Cargo.toml
            ${{ runner.temp }}/driver-error-dependencies/Cargo.lock
            ${{ runner.temp }}/driver-error-dependencies/crates/seaorm/Cargo.toml
            ${{ runner.temp }}/driver-error-dependencies/compat-tests/rust-server/Cargo.toml
            ${{ runner.temp }}/driver-error-dependencies/compat-tests/rust-server/Cargo.lock
            ${{ runner.temp }}/driver-error-dependencies/compat-tests/schema-consumer/Cargo.toml
            ${{ runner.temp }}/driver-error-dependencies/compat-tests/schema-consumer/Cargo.lock
            ${{ runner.temp }}/driver-error-dependencies/examples/fullstack/backend/Cargo.toml
            ${{ runner.temp }}/driver-error-dependencies/examples/fullstack/backend/Cargo.lock
          if-no-files-found: error
          retention-days: 14
