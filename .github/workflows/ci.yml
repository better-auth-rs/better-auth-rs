name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # The Test job builds the workspace and compat-tests/rust-server, which is a
  # separate manifest with its own target directory. Debug info for two full
  # dependency trees is enough to starve a hosted runner.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy --workspace --features axum -- -D warnings

  wasm-types:
    name: WASM Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p better-auth-types
      - run: cargo test -p better-auth-types --no-default-features
      - run: cargo check -p better-auth-types --target wasm32-unknown-unknown --all-targets
      - run: cargo check -p better-auth-types --no-default-features --target wasm32-unknown-unknown --all-targets
      - name: Verify shared types have no WASM runtime dependencies
        shell: bash
        run: |
          for features in '' '--no-default-features'; do
            cargo tree -p better-auth-types $features --target wasm32-unknown-unknown --prefix none > types-dependencies.txt
            if grep -E '^(js-sys|wasm-bindgen|web-sys) ' types-dependencies.txt; then
              echo 'Shared types must not depend on a browser or JavaScript runtime.'
              exit 1
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install reference server dependencies
        run: bun install --frozen-lockfile
        working-directory: compat-tests/reference-server
      - name: Install client compatibility dependencies
        run: bun install --frozen-lockfile
        working-directory: compat-tests/client-tests
      - name: Run library unit tests
        run: cargo test --workspace --lib
      - name: Run alignment checks
        run: ./scripts/alignment-check.sh

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
