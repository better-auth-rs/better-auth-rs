name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0} {1}', inputs.stage, inputs.profile) || 'Full acceptance' }} - ${{ github.ref_name }}

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      stage:
        description: Check stage; only all qualifies for master integration
        type: choice
        default: all
        required: true
        options:
          - all
          - dependencies
          - format
          - lint-default
          - lint-features
          - workspace-tests
          - rustls
          - rustdoc
          - consumer
          - fullstack
          - quick-start
          - alignment
          - client-configuration
          - device-validation
          - provider-options
          - passkey
          - two-factor
          - plugin-fields
          - schema-joins
          - user-fields
          - runtime-values
      profile:
        description: Optional existing profile for the client-configuration stage
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}-${{ inputs.profile || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Independent consumer and compatibility manifests have separate dependency builds.
  # Disable debug information to keep those builds within the runner disk limit.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    if: github.ref != 'refs/heads/codex/upstream-capture' || github.event_name == 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0}', inputs.stage) || 'Full acceptance - all stages' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ !contains(fromJSON('["lint-default", "lint-features", "format", "rustdoc", "runtime-values"]'), inputs.stage) && 'postgres:18.6' || '' }}
        env:
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth_ci
          POSTGRES_DB: better_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U better_auth -d better_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ !contains(fromJSON('["lint-default", "lint-features", "format", "rustdoc", "runtime-values"]'), inputs.stage) && 'mysql:8.4.11' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: better_auth_ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbetter_auth_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECK_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
      BETTER_AUTH_TEST_POSTGRES_URL: postgres://better_auth:better_auth_ci@127.0.0.1:5432/better_auth_test
      BETTER_AUTH_TEST_MYSQL_URL: mysql://root:better_auth_ci@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Expose the devenv Rust toolchain to the cache action
        run: |
          cat > "$RUNNER_TEMP/devenv-rust-path.sh" <<'SH'
          set -euo pipefail
          dirname "$(command -v rustc)" >> "$GITHUB_PATH"
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
          SH
          devenv shell -- bash "$RUNNER_TEMP/devenv-rust-path.sh"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: devenv-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          workspaces: |
            .
            compat-tests/rust-server
            compat-tests/schema-consumer
      - name: Install locked compatibility dependencies
        run: devenv shell -- ./scripts/check.sh dependencies
      - name: Check formatting
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'format'
        run: devenv shell -- ./scripts/check.sh format
      - name: Lint default features
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'lint-default'
        run: devenv shell -- ./scripts/check.sh lint-default
      - name: Lint integration features
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'lint-features'
        run: devenv shell -- ./scripts/check.sh lint-features
      - name: Test workspace
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'workspace-tests'
        run: devenv shell -- ./scripts/check.sh workspace-tests
      - name: Check Rustls configuration
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'rustls'
        run: devenv shell -- ./scripts/check.sh rustls
      - name: Build Rustdoc
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'rustdoc'
        run: devenv shell -- ./scripts/check.sh rustdoc
      - name: Check generated consumer and databases
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'consumer'
        run: devenv shell -- ./scripts/check.sh consumer
      - name: Check fullstack example
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'fullstack'
        run: devenv shell -- ./scripts/check.sh fullstack
      - name: Check quick-start guide
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'quick-start'
        run: devenv shell -- ./scripts/check.sh quick-start
      - name: Check upstream alignment
        if: env.CHECK_STAGE == 'all' || env.CHECK_STAGE == 'alignment'
        run: devenv shell -- ./scripts/check.sh alignment
      - name: Check client configuration compatibility
        if: env.CHECK_STAGE == 'client-configuration'
        env:
          CHECK_COMPAT_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ -n "$CHECK_COMPAT_PROFILE" ]]; then
            export COMPAT_TEST_PROFILE="$CHECK_COMPAT_PROFILE"
          fi
          devenv shell -- ./scripts/check.sh client-configuration
      - name: Check Device request validation
        if: env.CHECK_STAGE == 'device-validation'
        run: devenv shell -- ./scripts/check.sh device-validation
      - name: Check captured provider options
        if: env.CHECK_STAGE == 'provider-options'
        run: devenv shell -- ./scripts/check.sh provider-options
      - name: Check Passkey storage and authentication
        if: env.CHECK_STAGE == 'passkey'
        run: devenv shell -- ./scripts/check.sh passkey
      - name: Check TwoFactor storage and authentication
        if: env.CHECK_STAGE == 'two-factor'
        run: devenv shell -- ./scripts/check.sh two-factor
      - name: Check plugin fields and API Key storage
        if: env.CHECK_STAGE == 'plugin-fields'
        run: devenv shell -- ./scripts/check.sh plugin-fields
      - name: Check schema join references
        if: env.CHECK_STAGE == 'schema-joins'
        run: devenv shell -- ./scripts/check.sh schema-joins
      - name: Check User fields and ID generation
        if: env.CHECK_STAGE == 'user-fields'
        run: devenv shell -- ./scripts/check.sh user-fields
      - name: Check native runtime values
        if: env.CHECK_STAGE == 'runtime-values'
        run: devenv shell -- ./scripts/check.sh runtime-values
