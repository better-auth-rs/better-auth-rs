name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0} {1}', inputs.stage, inputs.profile) || 'Full acceptance' }} - ${{ github.ref_name }}

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      stage:
        description: Check stage; only all qualifies for master integration
        type: choice
        default: all
        required: true
        options:
          - all
          - dependencies
          - format
          - lint-default
          - lint-features
          - workspace-tests
          - rustls
          - rustdoc
          - consumer
          - consumer-schema
          - fullstack
          - quick-start
          - alignment
          - client-configuration
          - device-validation
          - device-storage
          - provider-options
          - oauth-duration
          - passkey
          - two-factor
          - plugin-fields
          - plugin-display-json
          - plugin-display-values
          - schema-joins
          - account-user-auth
          - user-fields
          - runtime-values
          - serial-primary
          - secondary-user-refresh
          - telemetry
          - email-verification
          - cookie-attributes
      profile:
        description: Optional existing profile for the client-configuration stage
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}-${{ inputs.profile || 'all' }}
  # A skipped push run must not cancel manual acceptance on the same branch.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Independent consumer and compatibility manifests have separate dependency builds.
  # Disable debug information to keep those builds within the runner disk limit.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    if: github.ref != 'refs/heads/codex/upstream-capture' || github.event_name == 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0}', inputs.stage) || 'Full acceptance - all stages' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ !contains(fromJSON('["lint-default", "lint-features", "format", "rustdoc", "runtime-values", "secondary-user-refresh", "account-user-auth", "telemetry", "plugin-display-values", "email-verification", "cookie-attributes", "oauth-duration"]'), inputs.stage) && 'postgres:18.6' || '' }}
        env:
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth_ci
          POSTGRES_DB: better_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U better_auth -d better_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ !contains(fromJSON('["lint-default", "lint-features", "format", "rustdoc", "runtime-values", "secondary-user-refresh", "account-user-auth", "telemetry", "plugin-display-values", "email-verification", "cookie-attributes", "oauth-duration"]'), inputs.stage) && 'mysql:8.4.11' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: better_auth_ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbetter_auth_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECK_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
      RUST_CACHE_STAGE: ${{ inputs.stage == 'oauth-duration' && 'provider-options' || github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
      BETTER_AUTH_TEST_POSTGRES_URL: postgres://better_auth:better_auth_ci@127.0.0.1:5432/better_auth_test
      BETTER_AUTH_TEST_MYSQL_URL: mysql://root:better_auth_ci@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@v6.1.0
        with:
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CACHE_STAGE }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/.cargo/config', '**/.cargo/config.toml', '**/rust-toolchain', '**/rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CACHE_STAGE }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/.cargo/config', '**/.cargo/config.toml', '**/rust-toolchain', '**/rust-toolchain.toml') }}-
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CACHE_STAGE }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            compat-tests/rust-server/target
            compat-tests/schema-consumer/target
      - name: Install locked compatibility dependencies
        run: devenv shell -- ./scripts/check.sh dependencies
      - name: Check formatting
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh format
      - name: Lint default features
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh lint-default
      - name: Lint integration features
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh lint-features
      - name: Test workspace
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh workspace-tests
      - name: Check Rustls configuration
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh rustls
      - name: Build Rustdoc
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh rustdoc
      - name: Check generated consumer and databases
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh consumer
      - name: Check fullstack example
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh fullstack
      - name: Check quick-start guide
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh quick-start
      - name: Check upstream alignment
        if: env.CHECK_STAGE == 'all'
        run: devenv shell -- ./scripts/check.sh alignment
      - name: Run focused check
        if: env.CHECK_STAGE != 'all'
        env:
          CHECK_COMPAT_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ "$CHECK_STAGE" == "client-configuration" && -n "$CHECK_COMPAT_PROFILE" ]]; then
            export COMPAT_TEST_PROFILE="$CHECK_COMPAT_PROFILE"
          fi
          if [[ "$CHECK_STAGE" == "consumer" || "$CHECK_STAGE" == "consumer-schema" ]]; then
            # Record runner resources before shutdown can skip post-job diagnostics.
            (
              while true; do
                date -u '+Consumer resources at %F %T UTC'
                free -m
                df -m . /nix
                ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | awk 'NR <= 12'
                for consumer_counter in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                  if [[ -r "$consumer_counter" ]]; then
                    printf '%s\n' "$consumer_counter"
                    cat "$consumer_counter"
                  fi
                done
                sleep 30
              done
            ) &
            consumer_sampler=$!
            trap 'consumer_status=$?; printf "Consumer command exit: %s\n" "$consumer_status"; kill "$consumer_sampler" 2>/dev/null || true; wait "$consumer_sampler" 2>/dev/null || true; exit "$consumer_status"' EXIT
          fi
          devenv shell -- ./scripts/check.sh "$CHECK_STAGE"
      - name: Save Rust cache
        if: ${{ !cancelled() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            compat-tests/rust-server/target
            compat-tests/schema-consumer/target
