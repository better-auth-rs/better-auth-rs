name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0} {1}', inputs.stage, contains(inputs.profile, ',') && 'profile batch' || inputs.profile) || 'Full acceptance' }} - ${{ github.ref_name }}

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      stage:
        description: Check stage; only all qualifies for master integration
        type: choice
        default: all
        required: true
        options:
          - all
          - dependencies
          - format
          - lint-default
          - lint-features
          - workspace-tests
          - id-input
          - rustls
          - rustdoc
          - consumer
          - consumer-schema
          - fullstack
          - quick-start
          - alignment
          - reference-contracts
          - client-configuration
          - credential-timing
          - validation-errors
          - rate-limit-declarations
          - device-validation
          - device-storage
          - provider-options
          - oauth-duration
          - oauth-proxy
          - passkey
          - two-factor
          - totp-period
          - plugin-fields
          - api-key-cache
          - jwt
          - native-create
          - plugin-display-json
          - plugin-display-values
          - memory-sorting
          - memory-query
          - sql-cleanup
          - shared-column
          - postgres-driver
          - mysql-driver
          - mysql-text
          - memory-joins
          - oauth-profile
          - organization-fields
          - organization-details
          - organization-transactions
          - organization-team-delete
          - organization-members
          - schema-joins
          - field-projection
          - account-user-auth
          - oauth-signin-order
          - atomic-updates
          - user-fields
          - runtime-values
          - native-json
          - logger
          - native-errors
          - serial-primary
          - secondary-user-refresh
          - telemetry
          - email-verification
          - cookie-attributes
      profile:
        description: Optional comma-separated client profiles (client-configuration) or contract filenames (reference-contracts)
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  # Batch selections can exceed GitHub's 400-character concurrency-group limit.
  # Preserved runs from earlier commits must not block the current commit's checks.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}-${{ contains(inputs.profile, ',') && github.run_id || inputs.profile || 'all' }}
  # A skipped push run must not cancel manual acceptance on the same branch.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Independent consumer and compatibility manifests have separate dependency builds.
  # Disable debug information to keep those builds within the runner disk limit.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    if: github.ref != 'refs/heads/codex/upstream-capture' || github.event_name == 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'all' && format('Focused check - {0}', inputs.stage) || 'Full acceptance - all stages' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ !contains(fromJSON('["id-input", "lint-default", "lint-features", "format", "rustdoc", "runtime-values", "native-json", "native-errors", "secondary-user-refresh", "account-user-auth", "oauth-signin-order", "telemetry", "plugin-display-values", "memory-sorting", "memory-query", "memory-joins", "oauth-profile", "organization-fields", "organization-details", "organization-transactions", "organization-team-delete", "organization-members", "api-key-cache", "jwt", "email-verification", "cookie-attributes", "oauth-duration", "oauth-proxy", "totp-period", "credential-timing", "validation-errors", "mysql-text"]'), inputs.stage) && 'postgres:18.6' || '' }}
        env:
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth_ci
          POSTGRES_DB: better_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U better_auth -d better_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ !contains(fromJSON('["id-input", "lint-default", "lint-features", "format", "rustdoc", "runtime-values", "native-json", "native-errors", "secondary-user-refresh", "account-user-auth", "oauth-signin-order", "telemetry", "plugin-display-values", "memory-sorting", "memory-query", "memory-joins", "oauth-profile", "organization-fields", "organization-details", "organization-transactions", "organization-team-delete", "organization-members", "api-key-cache", "jwt", "email-verification", "cookie-attributes", "oauth-duration", "oauth-proxy", "totp-period", "credential-timing", "validation-errors", "mysql-text"]'), inputs.stage) && 'mysql:8.4.11' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: better_auth_ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbetter_auth_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECK_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
      RUST_CACHE_STAGE: ${{ contains(fromJSON('["oauth-duration", "oauth-proxy"]'), inputs.stage) && 'provider-options' || inputs.stage == 'totp-period' && 'two-factor' || contains(fromJSON('["api-key-cache", "jwt", "atomic-updates"]'), inputs.stage) && 'plugin-fields' || contains(fromJSON('["id-input", "native-create", "native-json", "logger", "native-errors", "memory-query", "sql-cleanup", "organization-fields", "organization-details", "organization-transactions", "organization-team-delete", "organization-members", "field-projection", "validation-errors", "rate-limit-declarations"]'), inputs.stage) && 'user-fields' || inputs.stage == 'memory-sorting' && 'plugin-display-values' || contains(fromJSON('["credential-timing", "oauth-signin-order", "memory-joins", "oauth-profile"]'), inputs.stage) && 'account-user-auth' || github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
      BETTER_AUTH_TEST_POSTGRES_URL: postgres://better_auth:better_auth_ci@127.0.0.1:5432/better_auth_test
      BETTER_AUTH_TEST_MYSQL_URL: mysql://root:better_auth_ci@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          devenv_nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs-src"]["locked"]["rev"])')
          nix profile add "github:NixOS/nixpkgs/${devenv_nixpkgs_rev}#devenv"
      - name: Cache Rust dependencies
        if: env.CHECK_STAGE != 'reference-contracts'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: rust-deps-v1
          shared-key: ${{ env.RUST_CACHE_STAGE }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          cmd-format: devenv shell -- {0}
          cache-on-failure: 'true'
          cache-bin: 'false'
          cache-all-crates: 'false'
          cache-workspace-crates: 'false'
          # The post action removes workspace artifacts after the uploads below.
          workspaces: |
            . -> target
            compat-tests/rust-server -> target
            compat-tests/schema-consumer -> target
      - name: Check lockfiles after cache initialization
        if: env.CHECK_STAGE != 'reference-contracts'
        run: git diff --exit-code -- Cargo.lock compat-tests/rust-server/Cargo.lock compat-tests/schema-consumer/Cargo.lock
      - name: Install locked compatibility dependencies
        id: dependencies
        run: devenv shell -- ./scripts/check.sh dependencies
      - name: Capture upstream logger environment
        if: ${{ !cancelled() && contains(fromJSON('["all", "native-json", "logger", "workspace-tests"]'), env.CHECK_STAGE) && steps.dependencies.outcome == 'success' }}
        run: |
          devenv shell -- bun --no-install compat-tests/reference-server/contracts/logger-host-color-observation.mjs > "$RUNNER_TEMP/logger-host-color.json"
          printf '%s\n' "BETTER_AUTH_LOGGER_UPSTREAM_OBSERVATION=$RUNNER_TEMP/logger-host-color.json" >> "$GITHUB_ENV"
      - name: Capture upstream telemetry environment
        if: ${{ !cancelled() && contains(fromJSON('["all", "telemetry"]'), env.CHECK_STAGE) && steps.dependencies.outcome == 'success' }}
        env:
          TELEMETRY_ENVIRONMENT_OUTPUT: ${{ runner.temp }}/telemetry-host-observations/upstream.json
        run: |
          mkdir -p "$RUNNER_TEMP/telemetry-host-observations/rust"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/telemetry-host-observations/source-sha.txt"
          devenv shell -- bun --no-install compat-tests/reference-server/contracts/telemetry-environment.mjs
          printf '%s\n' \
            "BETTER_AUTH_TELEMETRY_OBSERVATION_DIR=$RUNNER_TEMP/telemetry-host-observations/rust" \
            "BETTER_AUTH_TELEMETRY_UPSTREAM_OBSERVATION=$RUNNER_TEMP/telemetry-host-observations/upstream.json.system-observation.json" \
            "TELEMETRY_CPU_ERROR_OUTPUT=$RUNNER_TEMP/telemetry-host-observations/cpu-errors.json" >> "$GITHUB_ENV"
      - name: Check formatting
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh format
      - name: Lint default features
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh lint-default
      - name: Lint integration features
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh lint-features
      - name: Test workspace
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh workspace-tests
      - name: Check PostgreSQL driver protocol
        id: postgres-protocol
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ env.BETTER_AUTH_TEST_POSTGRES_URL }}
        run: devenv shell -- ./scripts/test-postgres-driver-protocol.sh "$RUNNER_TEMP/postgres-driver-protocol"
      - name: Check MySQL driver protocol
        id: mysql-protocol
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ env.BETTER_AUTH_TEST_MYSQL_URL }}
        run: devenv shell -- ./scripts/test-mysql-driver-errors.sh "$RUNNER_TEMP/mysql-driver-protocol"
      - name: Check MySQL compiler and native text contracts
        id: mysql-text
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/test-mysql-text.sh "$RUNNER_TEMP/mysql-text"
      - name: Check the complete pinned mysql2 error table
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: python3 scripts/check-mysql-error-codes.py
      - name: Check Rustls configuration
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh rustls
      - name: Build Rustdoc
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh rustdoc
      - name: Check generated consumer and databases
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh consumer
      - name: Check fullstack example
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh fullstack
      - name: Check quick-start guide
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh quick-start
      - name: Check upstream alignment
        if: ${{ !cancelled() && env.CHECK_STAGE == 'all' && steps.dependencies.outcome == 'success' }}
        run: devenv shell -- ./scripts/check.sh alignment
      - name: Run focused check
        id: focused
        if: ${{ !cancelled() && env.CHECK_STAGE != 'all' && steps.dependencies.outcome == 'success' }}
        env:
          CHECK_COMPAT_PROFILE: ${{ inputs.profile }}
        run: |
          set -o pipefail
          if [[ "$CHECK_STAGE" == "client-configuration" && -n "$CHECK_COMPAT_PROFILE" ]]; then
            export COMPAT_TEST_PROFILE="$CHECK_COMPAT_PROFILE"
          fi
          if [[ "$CHECK_STAGE" == "consumer" || "$CHECK_STAGE" == "consumer-schema" ]]; then
            # Record runner resources before shutdown can skip post-job diagnostics.
            (
              while true; do
                date -u '+Consumer resources at %F %T UTC'
                free -m
                df -m . /nix
                ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | awk 'NR <= 12'
                for consumer_counter in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                  if [[ -r "$consumer_counter" ]]; then
                    printf '%s\n' "$consumer_counter"
                    cat "$consumer_counter"
                  fi
                done
                sleep 30
              done
            ) &
            consumer_sampler=$!
            trap 'consumer_status=$?; printf "Consumer command exit: %s\n" "$consumer_status"; kill "$consumer_sampler" 2>/dev/null || true; wait "$consumer_sampler" 2>/dev/null || true; exit "$consumer_status"' EXIT
          fi
          devenv shell -- ./scripts/check.sh "$CHECK_STAGE" 2>&1 | tee "$RUNNER_TEMP/focused-check.log"
      - name: Preserve focused check log before cache upload
        if: always() && (steps.focused.outcome == 'success' || steps.focused.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: focused-check-${{ inputs.stage }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-check.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve logger host observation
        if: always() && contains(fromJSON('["all", "native-json", "logger", "workspace-tests"]'), env.CHECK_STAGE)
        uses: actions/upload-artifact@v4
        with:
          name: logger-host-color-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logger-host-color.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve PostgreSQL protocol results
        if: always() && ((env.CHECK_STAGE == 'all' && steps.postgres-protocol.outcome != 'skipped') || (env.CHECK_STAGE == 'postgres-driver' && steps.focused.outcome != 'skipped'))
        uses: actions/upload-artifact@v4
        with:
          name: postgres-driver-protocol-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-driver-protocol/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve MySQL protocol results
        if: always() && ((env.CHECK_STAGE == 'all' && steps.mysql-protocol.outcome != 'skipped') || (env.CHECK_STAGE == 'mysql-driver' && steps.focused.outcome != 'skipped'))
        uses: actions/upload-artifact@v4
        with:
          name: mysql-driver-protocol-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mysql-driver-protocol/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve MySQL text contracts
        if: always() && ((env.CHECK_STAGE == 'all' && steps.mysql-text.outcome != 'skipped') || (env.CHECK_STAGE == 'mysql-text' && steps.focused.outcome != 'skipped'))
        uses: actions/upload-artifact@v4
        with:
          name: mysql-text-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mysql-text/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve telemetry host observations
        if: always() && contains(fromJSON('["all", "telemetry"]'), env.CHECK_STAGE)
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-host-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telemetry-host-observations/
          if-no-files-found: error
          retention-days: 14
