name: Release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  delete-old-branches:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Delete release-plz branch
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # better-auth-core builds rust_icu with `icu_version_in_env`. The semver
      # check compiles it, so provide the ICU 78 that devenv.nix uses.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Provide ICU 78 from the locked devenv nixpkgs revision
        run: |
          nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
          icu=$(nix build --no-link --print-out-paths "github:cachix/devenv-nixpkgs/${nixpkgs_rev}#icu78^out")
          echo "RUST_ICU_MAJOR_VERSION_NUMBER=78" >> "$GITHUB_ENV"
          echo "RUST_ICU_LINK_SEARCH_DIR=${icu}/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: release-pr
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # `cargo publish` verifies each crate with a build, and better-auth-cli
      # links ICU. Provide the same ICU 78 as the release-pr job.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Provide ICU 78 from the locked devenv nixpkgs revision
        run: |
          nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
          icu=$(nix build --no-link --print-out-paths "github:cachix/devenv-nixpkgs/${nixpkgs_rev}#icu78^out")
          echo "RUST_ICU_MAJOR_VERSION_NUMBER=78" >> "$GITHUB_ENV"
          echo "RUST_ICU_LINK_SEARCH_DIR=${icu}/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
