[package]
name = "better-auth-diesel"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Diesel integration for better-auth"
repository = { workspace = true }

[lints]
workspace = true

[features]
default = ["postgres", "sqlite", "bundled-sqlite"]
postgres = [
    "diesel/postgres_backend",
    "diesel-async/postgres",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]
# `RETURNING` needs SQLite 3.35 or later.
sqlite = ["diesel/sqlite", "diesel/returning_clauses_for_sqlite_3_35", "diesel-async/sqlite"]
# Compile SQLite into the binary instead of linking the system library.
bundled-sqlite = ["sqlite", "libsqlite3-sys/bundled"]

[dependencies]
better-auth-core = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

diesel = { version = "2.3", default-features = false, features = ["32-column-tables", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["deadpool", "migrations"] }
diesel_migrations = "2.3"
libsqlite3-sys = { version = ">=0.30, <0.39", optional = true }
tracing = { workspace = true }

# TLS for `DieselPool::postgres`, honoring `sslmode` in the database URL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, optional = true }
